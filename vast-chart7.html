<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>圖表</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px}
.chart{position:relative;height:330px}
.cap{color:#67757f;font-size:13px;margin-top:8px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="chart"><canvas id="cDisc"></canvas></div>
  <div class="cap">營收成長與折扣率脫鉤(營收指數 vs 折扣率)。<br>資料來源:Shopify｜四段各 12 個月。</div>
</div>
<script>
(function(){
  function draw(){
    var NAVY='#24262e',TEAL='#566487',ORANGE='#a83048',SAND='#c3d2df',GREY='#9aa0a8',RED='#a83048',PURP='#566487',LGREY='#d7dade';
    Chart.defaults.font.family='"Microsoft JhengHei","Noto Sans TC",sans-serif';
    Chart.defaults.font.size=12;
    Chart.defaults.plugins.legend.labels.boxWidth=12;
    var tl=["23Q4","24Q1","24Q2","24Q3","24Q4","25Q1","25Q2","25Q3","25Q4","26Q1","26Q2"];

    new Chart(document.getElementById('cDisc'),{
      data:{labels:['合作前第2年','合作前一年','合作後一年','最新一年'],datasets:[
        {type:'bar',label:'自有品牌營收指數',data:[100,56,177,305],backgroundColor:[LGREY,GREY,TEAL,NAVY],yAxisID:'y',order:2},
        {type:'line',label:'折扣率 %',data:[37,48,34,30],borderColor:ORANGE,backgroundColor:ORANGE,yAxisID:'y1',tension:.3,pointRadius:5,borderWidth:3,order:1}]},
      options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        scales:{y:{title:{display:true,text:'營收指數(=100)'},grid:{color:'#eee'}},
          y1:{position:'right',min:0,max:60,title:{display:true,text:'折扣率 %'},grid:{drawOnChartArea:false}}}}});
  }
  if(window.Chart){draw();}else{
    var t=setInterval(function(){if(window.Chart){clearInterval(t);draw();}},100);
  }
})();
</script>
</body></html>
