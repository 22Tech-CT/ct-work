<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>圖表</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px}
.chart{position:relative;height:360px}
.cap{color:#67757f;font-size:13px;margin-top:8px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="chart"><canvas id="cTraffic"></canvas></div>
  <div class="cap">營收結構、總體流量與轉換率變化(均指數化)。<br>資料來源:Shopify / GA4｜合作起始季=100。</div>
</div>
<script>
(function(){
  function draw(){
    var NAVY='#24262e',TEAL='#566487',ORANGE='#a83048',SAND='#c3d2df',GREY='#9aa0a8',RED='#a83048',PURP='#566487',LGREY='#d7dade';
    Chart.defaults.font.family='"Microsoft JhengHei","Noto Sans TC",sans-serif';
    Chart.defaults.font.size=12;
    Chart.defaults.plugins.legend.labels.boxWidth=12;
    var tl=["23Q4","24Q1","24Q2","24Q3","24Q4","25Q1","25Q2","25Q3","25Q4","26Q1","26Q2"];

    var own=[14,11,9,13,45,23,23,61,56,26,95];
    var non=[28,81,23,82,55,42,59,83,52,13,156];
    var totf=[58,47,57,69,100,66,128,290,324,209,423];
    var cvr=[80,66,59,75,100,55,43,36,32,34,45];
    new Chart(document.getElementById('cTraffic'),{data:{labels:tl,datasets:[
      {type:'bar',label:'自有商品營收',data:own,backgroundColor:TEAL,yAxisID:'y',stack:'rev',order:3},
      {type:'bar',label:'非自有商品營收',data:non,backgroundColor:'#c3d2df',yAxisID:'y',stack:'rev',order:3},
      {type:'line',label:'總體流量指數',data:totf,borderColor:'#24262e',backgroundColor:'#24262e',yAxisID:'y2',tension:.35,pointRadius:3,borderWidth:2.8,order:1},
      {type:'line',label:'轉換率指數',data:cvr,borderColor:ORANGE,backgroundColor:ORANGE,yAxisID:'y1',tension:.3,pointRadius:3,borderWidth:2.4,borderDash:[5,3],order:1}]},
      options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        scales:{x:{stacked:true},
          y:{position:'left',stacked:true,min:0,max:460,title:{display:true,text:'流量 / 營收 指數(合作起始季=100)'},grid:{color:'#eee'}},
          y2:{position:'left',stacked:false,min:0,max:460,display:false},
          y1:{position:'right',min:0,max:120,title:{display:true,text:'轉換率指數(合作起始季=100)'},grid:{drawOnChartArea:false}}},
        plugins:{tooltip:{callbacks:{label:function(c){return c.dataset.label+': '+c.raw;}}}}}});
  }
  if(window.Chart){draw();}else{
    var t=setInterval(function(){if(window.Chart){clearInterval(t);draw();}},100);
  }
})();
</script>
</body></html>
