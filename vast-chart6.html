<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>圖表</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px}
.chart{position:relative;height:290px}
.cap{color:#67757f;font-size:13px;margin-top:8px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="chart"><canvas id="cSEO"></canvas></div>
  <div class="cap">自然搜尋(SEO)流量指數變化(合作起始季=100)。<br>資料來源:GA4 自然搜尋｜期間:2023Q4–2026Q2。</div>
</div>
<script>
(function(){
  function draw(){
    var NAVY='#24262e',TEAL='#566487',ORANGE='#a83048',SAND='#c3d2df',GREY='#9aa0a8',RED='#a83048',PURP='#566487',LGREY='#d7dade';
    Chart.defaults.font.family='"Microsoft JhengHei","Noto Sans TC",sans-serif';
    Chart.defaults.font.size=12;
    Chart.defaults.plugins.legend.labels.boxWidth=12;
    var tl=["23Q4","24Q1","24Q2","24Q3","24Q4","25Q1","25Q2","25Q3","25Q4","26Q1","26Q2"];

    var org=[105,88,120,138,100,75,126,210,161,115,252];
    new Chart(document.getElementById('cSEO'),{type:'line',data:{labels:tl,datasets:[
      {label:'自然搜尋(SEO)流量指數',data:org,borderColor:'#566487',backgroundColor:'rgba(86,100,135,0.14)',tension:.35,pointRadius:3,borderWidth:2.8,fill:true}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{y:{title:{display:true,text:'SEO 流量指數(合作起始季=100)'},grid:{color:'#eee'}}}}});
  }
  if(window.Chart){draw();}else{
    var t=setInterval(function(){if(window.Chart){clearInterval(t);draw();}},100);
  }
})();
</script>
</body></html>
